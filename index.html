<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IWOKEUPINANEWBUGGATI</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050011; font-family: 'Arial Black', Impact, sans-serif; user-select: none; touch-action: none; text-transform: uppercase; }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Speed Lines Effect */
        #speed-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; opacity: 0; transition: opacity 0.2s; background: radial-gradient(circle, transparent 40%, rgba(255, 255, 255, 0.1) 80%, rgba(255, 255, 255, 0.5) 100%); mix-blend-mode: overlay; }

        #home-btn { position: absolute; top: 15px; left: 15px; z-index: 100; color: #fff; text-decoration: none; font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.8); padding: 10px 15px; border-left: 4px solid #ff0055; letter-spacing: 2px; transition: 0.2s; }
        #home-btn:hover { background: #ff0055; color: #000; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; z-index: 5; }
        
        /* Revamped HUD */
        #progress-bar-container { width: 100%; height: 8px; background: rgba(255,255,255,0.1); position: relative; }
        #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff0055, #00ffff); transition: width 0.2s; box-shadow: 0 0 10px #ff00ff; }
        #progress-text { position: absolute; top: 12px; width: 100%; text-align: center; font-size: 14px; color: #fff; letter-spacing: 4px; text-shadow: 0 0 5px #000; }

        .top-hud { display: flex; justify-content: space-between; padding: 40px 20px 20px 20px; width: calc(100% - 40px); }
        .hud-box { background: linear-gradient(90deg, rgba(0,0,0,0.9), transparent); padding: 10px 20px; border-left: 5px solid #00ffff; color: #fff; font-size: 24px; font-style: italic; text-shadow: 0 0 10px #00ffff; display: flex; align-items: center; gap: 10px; transition: border-color 0.5s, text-shadow 0.5s; }
        .coin-hud { border-left-color: #ffd700; background: linear-gradient(-90deg, rgba(0,0,0,0.9), transparent); flex-direction: row-reverse; text-shadow: 0 0 10px #ffd700; color: #ffd700; }
        #speed-gauge { font-size: 36px; color: #ff00ff; text-shadow: 0 0 15px #ff00ff; text-align: right; margin-top: 10px; font-style: italic; transition: color 0.5s, text-shadow 0.5s, transform 0.1s;}
        .coin-icon { width: 24px; height: 24px; background: radial-gradient(circle, #ffd700 0%, #b8860b 100%); border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 15px #ffd700; }
        
        #powerup-hud { display: flex; gap: 10px; margin-top: 10px; justify-content: flex-end; }
        .powerup-icon { width: 45px; height: 45px; border-radius: 0; display: none; align-items: center; justify-content: center; font-size: 24px; color: white; border: 2px solid white; animation: pulse 1s infinite alternate; }
        #magnet-icon { background: #ff00ff; box-shadow: 0 0 20px #ff00ff; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* Level Announcer */
        #level-announcer { position: absolute; top: 30%; left: 0; width: 100%; text-align: center; color: white; font-size: 70px; font-style: italic; letter-spacing: 15px; z-index: 10; opacity: 0; transform: scale(0.5) skewX(-10deg); pointer-events: none; transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-shadow: 0 0 40px #fff, 0 0 20px #ff0055; }
        .announce-active { opacity: 1 !important; transform: scale(1) skewX(-10deg) !important; }

        /* Sleek Menu Screen */
        .menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(10,0,15,0.95), rgba(0,0,0,1)); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; backdrop-filter: blur(12px); z-index: 20; transition: background 1s; }
        h1 { color: #fff; font-size: 64px; margin: 0 0 5px 0; letter-spacing: 8px; font-style: italic; background: -webkit-linear-gradient(#fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(255,255,255,0.3)); text-align: center; }
        .subtitle { color: #ff0055; font-size: 24px; margin-bottom: 20px; text-shadow: 0 0 10px #ff0055; letter-spacing: 5px; }
        .credits { font-size: 12px; color: #666; margin-bottom: 30px; letter-spacing: 1px; font-family: monospace; }
        
        button { background: transparent; color: #fff; border: 2px solid #00ffff; padding: 15px 40px; font-size: 24px; font-weight: 900; font-style: italic; cursor: pointer; box-shadow: 0 0 15px rgba(0,255,255,0.2), inset 0 0 10px rgba(0,255,255,0.2); transition: 0.2s; margin: 10px; font-family: 'Arial Black', sans-serif; text-transform: uppercase; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 30px #00ffff, inset 0 0 20px #00ffff; background: rgba(0,255,255,0.2); }
        button:active { transform: scale(0.95); }
        .btn-small { padding: 12px 25px; font-size: 18px; border-color: #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.2), inset 0 0 10px rgba(255,0,255,0.2); }
        .btn-small:hover { box-shadow: 0 0 20px #ff00ff, inset 0 0 15px #ff00ff; background: rgba(255,0,255,0.2); }
        .btn-danger { border-color: #ff0055; box-shadow: 0 0 10px rgba(255,0,85,0.2), inset 0 0 10px rgba(255,0,85,0.2); }
        .btn-danger:hover { box-shadow: 0 0 20px #ff0055, inset 0 0 15px #ff0055; background: rgba(255,0,85,0.2); }
        
        .button-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }

        .ui-panel { background: rgba(0,0,0,0.8); border: 1px solid #333; padding: 20px; margin-bottom: 20px; text-align: center; }
        select { background: #000; color: #00ffff; border: 1px solid #00ffff; padding: 10px; font-size: 16px; font-family: 'Arial Black', sans-serif; outline: none; margin-top: 10px; cursor: pointer; text-transform: uppercase; }

        .slider-container { margin: 15px 0; text-align: center; width: 300px; }
        label { color: #00ffff; font-size: 18px; display: block; margin-bottom: 10px; text-shadow: 0 0 8px #00ffff; }
        input[type=range] { width: 100%; accent-color: #ff00ff; height: 10px; cursor: pointer; }

        #shop-list { display: flex; gap: 20px; margin: 20px 0; max-width: 90vw; overflow-x: auto; padding: 20px; scroll-behavior: smooth; }
        .shop-item { background: #050505; border: 2px solid #333; padding: 20px; text-align: center; min-width: 180px; color: white; transition: 0.3s; position: relative; overflow: hidden; }
        .shop-item.owned { border-color: #00ffff; box-shadow: inset 0 0 15px rgba(0,255,255,0.1); }
        .shop-item.equipped { border-color: #ff00ff; box-shadow: 0 0 25px rgba(255,0,255,0.5), inset 0 0 20px rgba(255,0,255,0.2); transform: translateY(-10px); }
        .color-preview { width: 100%; height: 70px; margin-bottom: 15px; border: 1px solid #555; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <a id="home-btn" href="https://dando.in">🏠 DANDO.IN</a>

    <div id="game-container"></div>
    <div id="speed-lines"></div>

    <div id="ui-layer">
        <div id="progress-bar-container">
            <div id="progress-fill"></div>
            <div id="progress-text">STAGE 1 -> STAGE 2</div>
        </div>
        <div class="top-hud">
            <div>
                <div class="hud-box" id="score-box">SCORE <span id="score" style="margin-left:10px;">0</span></div>
                <div style="color:#555; font-size: 16px; margin-top:5px; padding-left: 5px; letter-spacing: 2px;">HIGH <span id="high-score-hud">0</span></div>
            </div>
            <div>
                <div class="hud-box coin-hud"><div class="coin-icon"></div> <span id="coin-counter">0</span></div>
                <div id="speed-gauge">0 KM/H</div>
                <div id="powerup-hud">
                    <div id="magnet-icon" class="powerup-icon">🧲</div>
                </div>
            </div>
        </div>
    </div>

    <div id="level-announcer">STAGE COMPLETE</div>

    <div id="start-screen" class="menu-screen">
        <h1>IWOKEUPINANEWBUGGATI</h1>
        <div class="subtitle">HARDCORE EDITION</div>
        <div class="credits">♪ Audio Credits: "I Woke Up In A New Bugatti" (song0.mp3)</div>
        
        <div class="ui-panel">
            <div style="color: #fff; font-size: 18px; margin-bottom: 10px;">SELECT STARTING STAGE</div>
            <select id="stage-select"></select>
        </div>

        <button id="start-btn">ENTER HIGHWAY</button>
        <div class="button-row">
            <button class="btn-small" id="open-shop-btn">GARAGE</button>
            <button class="btn-small" id="open-settings-btn">SETTINGS</button>
        </div>
    </div>

    <div id="shop-screen" class="menu-screen hidden">
        <h1>GARAGE</h1>
        <div class="hud-box coin-hud" style="margin-bottom: 20px;"><div class="coin-icon"></div> <span id="shop-coins">0</span></div>
        <div id="shop-list"></div>
        <button class="btn-small" id="close-shop-btn">BACK</button>
    </div>

    <div id="settings-screen" class="menu-screen hidden">
        <h1>SETTINGS</h1>
        <div class="slider-container">
            <label for="volume">MUSIC VOLUME: <span id="vol-val">50%</span></label>
            <input type="range" id="volume" min="0" max="100" value="50">
        </div>
        <button class="btn-small btn-danger" id="wipe-save-btn" style="margin-top: 30px;">WIPE SAVE DATA</button>
        <br>
        <button class="btn-small" style="margin-top:20px;" id="close-settings-btn">SAVE & BACK</button>
    </div>

    <div id="game-over-screen" class="menu-screen hidden">
        <h1 style="font-size: 90px; -webkit-text-fill-color: #ff0000; filter: drop-shadow(0 0 20px rgba(255,0,0,0.8)); margin-bottom: 0;">WRECKED</h1>
        <div class="subtitle" id="death-reason">YOU CRASHED.</div>
        <div class="ui-panel" style="background: transparent; border: none;">
            <div class="hud-box" style="margin-bottom: 15px; font-size: 28px; justify-content: center;">FINAL SCORE <span id="final-score" style="color: #00ffff; margin-left: 10px;">0</span></div>
            <div class="hud-box coin-hud" style="margin-bottom: 40px; font-size: 28px; justify-content: center;">COINS EARNED <span id="final-coins" style="color: #fff; margin-left: 10px;">+0</span></div>
        </div>
        <button id="restart-btn" style="padding: 20px 60px; font-size: 32px; border-color: #ff0055;">RESPAWN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- Core Config & Hardcore Multipliers ---
        const CONFIG = { laneWidth: 3.8, pathLength: 150, gravity: 80, jumpForce: 25, baseSpeed: 50 };
        
        const LEVELS = [
            { score: 0,       bg: 0x050011, fog: 0x0a001a, floor: 0x00ffff, sun: 0xff00ff, name: "STAGE 1: NEON CITY", speedMult: 1.0, coinMult: 1 },
            { score: 100,     bg: 0x001100, fog: 0x002200, floor: 0x00ff00, sun: 0x39ff14, name: "STAGE 2: GREEN ZONE", speedMult: 1.4, coinMult: 2 },
            { score: 1000,    bg: 0x1a0000, fog: 0x220000, floor: 0xff0000, sun: 0xffaa00, name: "STAGE 3: RED ALERT", speedMult: 1.8, coinMult: 5 },
            { score: 10000,   bg: 0x111111, fog: 0x222222, floor: 0xffffff, sun: 0xdddddd, name: "STAGE 4: WHITE OUT", speedMult: 2.3, coinMult: 10 },
            { score: 50000,   bg: 0x000000, fog: 0x050505, floor: 0x333333, sun: 0x444444, name: "STAGE 5: BLACK ABYSS", speedMult: 3.0, coinMult: 20 },
            { score: 100000,  bg: 0x110022, fog: 0x220044, floor: 0x00ffff, sun: 0xff00ff, name: "STAGE 6: NEON OVERDRIVE", speedMult: 4.0, coinMult: 50 },
            { score: 1000000, bg: 0x000000, fog: 0x000000, floor: 0xffffff, sun: 0xffffff, name: "STAGE 7: RGB GOD MODE", speedMult: 5.5, coinMult: 100 }
        ];

        const SKINS = [
            { id: 0, name: "Classic Copper", body: 0xb87333, neon: 0x00ffff, price: 0, preview: "linear-gradient(45deg, #b87333 50%, #00ffff 50%)" },
            { id: 1, name: "Midnight Purple", body: 0x2A004D, neon: 0xff00ff, price: 500, preview: "linear-gradient(45deg, #2A004D 50%, #ff00ff 50%)" },
            { id: 2, name: "Toxic Green", body: 0x0a0a0a, neon: 0x39ff14, price: 1500, preview: "linear-gradient(45deg, #0a0a0a 50%, #39ff14 50%)" },
            { id: 3, name: "Gold Digger", body: 0xffd700, neon: 0xffffff, price: 5000, preview: "linear-gradient(45deg, #ffd700 50%, #ffffff 50%)" },
            { id: 4, name: "Cyberpunk", body: 0xffcc00, neon: 0x00ffff, price: 15000, preview: "linear-gradient(45deg, #ffcc00 50%, #00ffff 50%)" },
            { id: 5, name: "Tron Runner", body: 0x111111, neon: 0x00ffff, price: 30000, preview: "linear-gradient(45deg, #000000 50%, #00ffff 50%)", special: 'wireframe' },
            { id: 6, name: "Blood Moon", body: 0x660000, neon: 0xff0000, price: 75000, preview: "linear-gradient(45deg, #660000 50%, #ff0000 50%)" },
            { id: 7, name: "Phantom Ghost", body: 0xffffff, neon: 0x00ffff, price: 200000, preview: "linear-gradient(45deg, rgba(255,255,255,0.4) 50%, #00ffff 50%)", special: 'ghost' }
        ];

        let saveData = { coins: 0, highScore: 0, unlockedSkins: [0], currentSkin: 0, volume: 0.5, maxStageUnlocked: 0 };

        function loadProgress() {
            try { const saved = localStorage.getItem('bugattiSaveV6'); if (saved) saveData = { ...saveData, ...JSON.parse(saved) }; } 
            catch (e) { console.error("Save load failed", e); }
            updateMenuUI();
            populateStageSelect();
        }
        function saveProgress() {
            try { localStorage.setItem('bugattiSaveV6', JSON.stringify(saveData)); } 
            catch (e) { console.error("Save failed", e); }
        }

        // --- Audio System ---
        const audioSystem = {
            bgm: null,
            playlist: ['song0.mp3'], // Referenced the requested song name
            playRandom: function() {
                if(!this.playlist[0]) return;
                if (this.bgm) { this.bgm.pause(); }
                this.bgm = new Audio(this.playlist[0]);
                this.bgm.volume = saveData.volume;
                this.bgm.loop = true;
                this.bgm.play().catch(e => console.log("Audio needs interaction"));
            },
            updateVolume: function() { if(this.bgm) this.bgm.volume = saveData.volume; }
        };

        // --- 3D Game Engine ---
        let scene, camera, renderer, player, underglowLight, sunLight, hemiLight;
        let pathChunks = [], obstacles = [], coins = [], powerups = [];
        const assets = { geos: {}, mats: {}, textures: {} };
        let runCoins = 0;

        let gameState = {
            isPlaying: false, score: 0, speed: CONFIG.baseSpeed, distance: 0, lane: 0, targetLaneX: 0,
            isJumping: false, isSliding: false, verticalVelocity: 0, slideTimer: 0,
            magnetTimer: 0, currentLevelIdx: 0, deathReason: ""
        };

        const clock = new THREE.Clock();

        function createGridTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#050011'; ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.shadowBlur = 10; ctx.shadowColor = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(20, 0); ctx.lineTo(20, 512); ctx.moveTo(492, 0); ctx.lineTo(492, 512);
            for(let i=0; i<512; i+=128) { ctx.moveTo(0, i); ctx.lineTo(512, i); }
            ctx.stroke();
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; return tex;
        }

        function initAssets() {
            assets.textures.grid = createGridTexture();
            
            // Vehicles Geometry
            assets.geos = {
                floor: new THREE.BoxGeometry(CONFIG.laneWidth * 3 + 4, 1, CONFIG.pathLength),
                barrier: new THREE.BoxGeometry(1, 1, CONFIG.pathLength),
                barrierStrip: new THREE.BoxGeometry(0.3, 0.1, CONFIG.pathLength),
                coin: new THREE.TorusGeometry(0.4, 0.15, 8, 16),
                carBody: new THREE.BoxGeometry(1.5, 0.5, 3.2),
                carCabin: new THREE.BoxGeometry(1.2, 0.4, 1.6),
                wheel: new THREE.CylinderGeometry(0.4, 0.4, 0.4, 24),
                powerup: new THREE.BoxGeometry(0.8, 0.8, 0.8),
                
                // Enemies
                enemyCar: new THREE.BoxGeometry(1.5, 1.0, 3.0),
                enemyBus: new THREE.BoxGeometry(1.8, 4.0, 6.0),
                tractorWheel: new THREE.BoxGeometry(0.8, 1.5, 2.0),
                tractorRoof: new THREE.BoxGeometry(3.6, 0.6, 2.5)
            };
            
            assets.mats = {
                floor: new THREE.MeshPhongMaterial({ map: assets.textures.grid, color: LEVELS[0].floor, shininess: 10 }),
                barrier: new THREE.MeshPhongMaterial({ color: 0x0a0a0a, shininess: 5 }),
                barrierStrip: new THREE.MeshBasicMaterial({ color: LEVELS[0].floor }),
                gold: new THREE.MeshPhongMaterial({ color: 0xffff00, emissive: 0x886600, shininess: 100 }),
                
                enemyCar: new THREE.MeshPhongMaterial({ color: 0xff3333, shininess: 80, specular: 0xffffff }),
                enemyBus: new THREE.MeshPhongMaterial({ color: 0x0055ff, shininess: 40 }),
                enemyTractor: new THREE.MeshPhongMaterial({ color: 0xffaa00, shininess: 20 }),
                
                carPaint: new THREE.MeshPhongMaterial({ color: SKINS[0].body, shininess: 100, specular: 0x888888 }),
                neon: new THREE.MeshBasicMaterial({ color: SKINS[0].neon }),
                glass: new THREE.MeshPhongMaterial({ color: 0x050505, shininess: 150, specular: 0xffffff }),
                tire: new THREE.MeshLambertMaterial({ color: 0x020202 }),
                magnet: new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true })
            };
        }

        function init() {
            loadProgress(); initAssets(); 

            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(LEVELS[0].bg); 
            scene.fog = new THREE.FogExp2(LEVELS[0].fog, 0.008); 
            
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 250);
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.4)); 
            hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            scene.add(hemiLight);

            sunLight = new THREE.DirectionalLight(LEVELS[0].sun, 1.2); 
            sunLight.position.set(-15, 30, -15); 
            sunLight.castShadow = true; 
            scene.add(sunLight);
            
            const fill = new THREE.DirectionalLight(0x00ffff, 0.5); 
            fill.position.set(15, 10, 20); 
            scene.add(fill);
            
            createPlayer(); 
            applySkin(saveData.currentSkin);

            for (let i = 0; i < 6; i++) createPathChunk(i * (-CONFIG.pathLength), i === 0);

            setupUIBindings();
            setupControls();
            animate();
        }

        function createPlayer() {
            player = new THREE.Group();
            player.glowEdges = []; 

            const body = new THREE.Mesh(assets.geos.carBody, assets.mats.carPaint); 
            body.position.y = 0.6; body.castShadow = true; 
            
            const bodyEdgesGeo = new THREE.EdgesGeometry(assets.geos.carBody);
            const bodyEdges = new THREE.LineSegments(bodyEdgesGeo, new THREE.LineBasicMaterial({ color: SKINS[0].neon, linewidth: 2 }));
            body.add(bodyEdges);
            player.glowEdges.push(bodyEdges);
            player.add(body);

            const cabin = new THREE.Mesh(assets.geos.carCabin, assets.mats.glass); 
            cabin.position.set(0, 1.0, -0.2); 
            
            const cabinEdgesGeo = new THREE.EdgesGeometry(assets.geos.carCabin);
            const cabinEdges = new THREE.LineSegments(cabinEdgesGeo, new THREE.LineBasicMaterial({ color: SKINS[0].neon, linewidth: 2 }));
            cabin.add(cabinEdges);
            player.glowEdges.push(cabinEdges);
            player.add(cabin);

            underglowLight = new THREE.PointLight(SKINS[0].neon, 3, 15);
            underglowLight.position.set(0, 0.2, 0); player.add(underglowLight);

            player.wheels = [];
            [{x:-0.8,z:1.0}, {x:0.8,z:1.0}, {x:-0.8,z:-1.0}, {x:0.8,z:-1.0}].forEach(pos => {
                const wheel = new THREE.Mesh(assets.geos.wheel, assets.mats.tire);
                wheel.rotation.z = Math.PI/2; wheel.position.set(pos.x, 0.4, pos.z); player.add(wheel); player.wheels.push(wheel);
                
                const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.42, 8), assets.mats.neon);
                hub.rotation.z = Math.PI/2; hub.position.set(pos.x, 0.4, pos.z); player.add(hub); player.wheels.push(hub);
            });

            player.exhausts = [];
            const exhaustGeo = new THREE.ConeGeometry(0.2, 1.0, 8);
            exhaustGeo.rotateX(Math.PI / 2);
            const exhaustMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.8 });
            
            const exhaustL = new THREE.Mesh(exhaustGeo, exhaustMat);
            exhaustL.position.set(-0.4, 0.45, 1.7); player.add(exhaustL); player.exhausts.push(exhaustL);
            
            const exhaustR = new THREE.Mesh(exhaustGeo, exhaustMat);
            exhaustR.position.set(0.4, 0.45, 1.7); player.add(exhaustR); player.exhausts.push(exhaustR);

            player.position.set(0, 0, 0); scene.add(player);
        }

        // Custom Tractor Group Generator
        function buildTractor() {
            const group = new THREE.Group();
            const lw = new THREE.Mesh(assets.geos.tractorWheel, assets.mats.enemyTractor);
            lw.position.set(-1.4, 0.75, 0); lw.castShadow = true;
            const rw = new THREE.Mesh(assets.geos.tractorWheel, assets.mats.enemyTractor);
            rw.position.set(1.4, 0.75, 0); rw.castShadow = true;
            const roof = new THREE.Mesh(assets.geos.tractorRoof, assets.mats.enemyTractor);
            roof.position.set(0, 2.5, 0); roof.castShadow = true; // High clearance
            group.add(lw, rw, roof);
            return group;
        }

        function createPathChunk(zPos, isSafe) {
            const grp = new THREE.Group();
            
            const floor = new THREE.Mesh(assets.geos.floor, assets.mats.floor); 
            floor.position.set(0, -0.5, zPos - CONFIG.pathLength/2); 
            floor.receiveShadow = true; 
            grp.add(floor);
            
            const lb = new THREE.Mesh(assets.geos.barrier, assets.mats.barrier); 
            lb.position.set(-(CONFIG.laneWidth*1.5+1), 0, zPos - CONFIG.pathLength/2); 
            const lbStrip = new THREE.Mesh(assets.geos.barrierStrip, assets.mats.barrierStrip);
            lbStrip.position.set(0, 0.55, 0); lb.add(lbStrip);
            grp.add(lb);
            
            const rb = new THREE.Mesh(assets.geos.barrier, assets.mats.barrier); 
            rb.position.set((CONFIG.laneWidth*1.5+1), 0, zPos - CONFIG.pathLength/2); 
            const rbStrip = new THREE.Mesh(assets.geos.barrierStrip, assets.mats.barrierStrip);
            rbStrip.position.set(0, 0.55, 0); rb.add(rbStrip);
            grp.add(rb);

            if (!isSafe) {
                const levelData = LEVELS[gameState.currentLevelIdx];
                const baseDensity = 30; // Further spread out since cars/buses are big
                const spawnGap = baseDensity / (1 + (gameState.currentLevelIdx * 0.15));

                for (let z = zPos - 15; z > zPos - CONFIG.pathLength + 15; z -= spawnGap) {
                    const r = Math.random();
                    if (r < 0.50) spawnTraffic(grp, z);
                    else if (r < 0.95) spawnCoin(grp, z);
                    else spawnPowerup(grp, z);
                }
            }
            scene.add(grp); pathChunks.push({ mesh: grp, z: zPos });
        }

        function spawnTraffic(grp, z) {
            const lane = Math.floor(Math.random() * 3) - 1;
            const r = Math.random();
            let obsType, mesh;

            if (r < 0.3) {
                obsType = 'bus';
                mesh = new THREE.Mesh(assets.geos.enemyBus, assets.mats.enemyBus);
                mesh.position.set(lane * CONFIG.laneWidth, 2.0, z); // Center Y of 4 unit box is 2
                mesh.castShadow = true;
            } else if (r < 0.6) {
                obsType = 'tractor';
                mesh = buildTractor();
                mesh.position.set(lane * CONFIG.laneWidth, 0, z);
            } else {
                obsType = 'car';
                mesh = new THREE.Mesh(assets.geos.enemyCar, assets.mats.enemyCar);
                mesh.position.set(lane * CONFIG.laneWidth, 0.5, z);
                mesh.castShadow = true;
            }
            
            grp.add(mesh);
            obstacles.push({ mesh: mesh, lane: lane, type: obsType, parentGroup: grp });
        }

        function spawnCoin(grp, z) {
            const lane = Math.floor(Math.random() * 3) - 1;
            const coin = new THREE.Mesh(assets.geos.coin, assets.mats.gold);
            coin.position.set(lane * CONFIG.laneWidth, 1.2, z); coin.rotation.y = Math.PI / 2; grp.add(coin);
            coins.push({ mesh: coin, active: true, z: z, parentGroup: grp });
        }

        function spawnPowerup(grp, z) {
            const lane = Math.floor(Math.random() * 3) - 1;
            const pu = new THREE.Mesh(assets.geos.powerup, assets.mats.magnet);
            pu.position.set(lane * CONFIG.laneWidth, 1.2, z); grp.add(pu);
            powerups.push({ mesh: pu, active: true, type: 'magnet', parentGroup: grp });
        }

        function populateStageSelect() {
            const select = document.getElementById('stage-select');
            select.innerHTML = '';
            for(let i=0; i<=saveData.maxStageUnlocked && i<LEVELS.length; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = LEVELS[i].name;
                select.appendChild(opt);
            }
        }

        function setupUIBindings() {
            document.getElementById('start-btn').addEventListener('click', startGame);
            
            document.getElementById('open-settings-btn').addEventListener('click', () => {
                document.getElementById('start-screen').classList.add('hidden'); document.getElementById('settings-screen').classList.remove('hidden');
                document.getElementById('volume').value = saveData.volume * 100; document.getElementById('vol-val').innerText = (saveData.volume * 100) + "%";
            });
            document.getElementById('volume').addEventListener('input', (e) => { saveData.volume = e.target.value / 100; document.getElementById('vol-val').innerText = e.target.value + "%"; audioSystem.updateVolume(); });
            document.getElementById('close-settings-btn').addEventListener('click', () => {
                document.getElementById('settings-screen').classList.add('hidden'); document.getElementById('start-screen').classList.remove('hidden'); saveProgress();
            });
            document.getElementById('wipe-save-btn').addEventListener('click', () => {
                if(confirm("DELETE EVERYTHING? Coins, Skins, and Stage Progress?")) { localStorage.removeItem('bugattiSaveV6'); location.reload(); }
            });

            document.getElementById('open-shop-btn').addEventListener('click', () => {
                document.getElementById('start-screen').classList.add('hidden'); document.getElementById('shop-screen').classList.remove('hidden');
                document.getElementById('shop-coins').innerText = saveData.coins; renderShopList();
            });
            document.getElementById('close-shop-btn').addEventListener('click', () => {
                document.getElementById('shop-screen').classList.add('hidden'); document.getElementById('start-screen').classList.remove('hidden');
            });
            document.getElementById('restart-btn').addEventListener('click', () => location.reload());
        }

        function updateMenuUI() {
            document.getElementById('high-score-hud').innerText = Math.floor(saveData.highScore);
            document.getElementById('coin-counter').innerText = saveData.coins;
        }

        function renderShopList() {
            const list = document.getElementById('shop-list'); list.innerHTML = '';
            SKINS.forEach(skin => {
                const isOwned = saveData.unlockedSkins.includes(skin.id);
                const isEquipped = saveData.currentSkin === skin.id;
                const item = document.createElement('div');
                item.className = `shop-item ${isOwned ? 'owned' : ''} ${isEquipped ? 'equipped' : ''}`;
                item.innerHTML = `
                    <div class="color-preview" style="background: ${skin.preview};"></div>
                    <div style="font-size: 16px; font-style:italic;"><b>${skin.name}</b></div>
                    ${!isOwned ? `<div style="color:#ffd700; font-weight:bold; margin:10px 0; font-size: 20px;">${skin.price} ¢</div>` : '<div style="margin:10px 0; color:#00ffff; font-weight:bold;">OWNED</div>'}
                    <button class="btn-small" style="width:100%; margin-top:5px; background: ${isEquipped ? 'rgba(0,255,255,0.2)' : ''}">${isEquipped ? 'EQUIPPED' : isOwned ? 'EQUIP' : 'BUY'}</button>
                `;
                item.querySelector('button').addEventListener('click', () => {
                    if (!isOwned) {
                        if (saveData.coins >= skin.price) { saveData.coins -= skin.price; saveData.unlockedSkins.push(skin.id); } 
                        else { alert("BROKE! Need more coins."); return; }
                    }
                    saveData.currentSkin = skin.id; applySkin(skin.id); saveProgress();
                    document.getElementById('shop-coins').innerText = saveData.coins; document.getElementById('coin-counter').innerText = saveData.coins;
                    renderShopList();
                });
                list.appendChild(item);
            });
        }

        function applySkin(id) {
            const skin = SKINS.find(s => s.id === id) || SKINS[0];
            assets.mats.carPaint.color.setHex(skin.body); 
            assets.mats.neon.color.setHex(skin.neon);
            if(underglowLight) underglowLight.color.setHex(skin.neon);
            if (player && player.glowEdges) { player.glowEdges.forEach(edge => { edge.material.color.setHex(skin.neon); }); }

            if (skin.special === 'wireframe') { 
                assets.mats.carPaint.wireframe = true; assets.mats.carPaint.color.setHex(0x000000); assets.mats.carPaint.emissive.setHex(skin.neon); assets.mats.carPaint.emissiveIntensity = 0.5; 
            } else { 
                assets.mats.carPaint.wireframe = false; assets.mats.carPaint.emissive.setHex(0x000000); assets.mats.carPaint.emissiveIntensity = 0;
            }
            if (skin.special === 'ghost') { assets.mats.carPaint.transparent = true; assets.mats.carPaint.opacity = 0.3; } 
            else { assets.mats.carPaint.transparent = false; assets.mats.carPaint.opacity = 1.0; }
        }

        function startGame() {
            const startStage = parseInt(document.getElementById('stage-select').value) || 0;
            
            document.getElementById('start-screen').classList.add('hidden');
            gameState = { 
                isPlaying: true, score: LEVELS[startStage].score, speed: CONFIG.baseSpeed, distance: 0, lane: 0, targetLaneX: 0, 
                isJumping: false, isSliding: false, verticalVelocity: 0, slideTimer: 0, 
                magnetTimer: 0, currentLevelIdx: startStage, deathReason: ""
            };
            runCoins = 0; updateMenuUI();
            document.getElementById('magnet-icon').style.display = 'none';
            audioSystem.playRandom();
            document.getElementById('speed-lines').style.opacity = '0';
            
            // Apply stage colors instantly
            const l0 = LEVELS[startStage];
            scene.background.setHex(l0.bg);
            scene.fog.color.setHex(l0.fog);
            sunLight.color.setHex(l0.sun);
            assets.mats.floor.color.setHex(l0.floor);
            assets.mats.barrierStrip.color.setHex(l0.floor);
        }

        // --- Controls ---
        function animateSteer(rotation) {
            player.rotation.z = rotation; 
            setTimeout(() => { if(player) player.rotation.z = 0; }, 200);
        }
        function doJump() {
            if (!gameState.isJumping && !gameState.isSliding) {
                gameState.isJumping = true; gameState.verticalVelocity = CONFIG.jumpForce; player.rotation.x = -0.15;
            }
        }
        function doSlide() {
            if (!gameState.isJumping && !gameState.isSliding) {
                gameState.isSliding = true; gameState.slideTimer = 0.8; player.scale.y = 0.4;
            }
        }

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                if (!gameState.isPlaying) return;
                const key = e.key.toLowerCase();
                if ((key === 'arrowleft' || key === 'a') && gameState.lane > -1) { gameState.lane--; animateSteer(0.15); }
                if ((key === 'arrowright' || key === 'd') && gameState.lane < 1) { gameState.lane++; animateSteer(-0.15); }
                if (key === 'arrowup' || key === 'w' || key === ' ') doJump();
                if (key === 'arrowdown' || key === 's') doSlide();
            });

            let touchStartX = 0; let touchStartY = 0;
            document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; }, {passive: false});
            
            document.addEventListener('touchend', e => {
                if (!gameState.isPlaying) return;
                const dX = e.changedTouches[0].screenX - touchStartX; const dY = e.changedTouches[0].screenY - touchStartY;
                if (Math.abs(dX) > Math.abs(dY)) { 
                    if (dX > 30 && gameState.lane < 1) { gameState.lane++; animateSteer(-0.15); }
                    else if (dX < -30 && gameState.lane > -1) { gameState.lane--; animateSteer(0.15); }
                } else { 
                    if (dY < -30) doJump();
                    else if (dY > 30) doSlide();
                }
            }, {passive: false});
        }

        function triggerLevelUp(levelName) {
            const el = document.getElementById('level-announcer');
            el.innerText = levelName;
            el.classList.add('announce-active');
            
            const box = document.getElementById('score-box');
            box.style.borderLeftColor = "#ff00ff";
            
            setTimeout(() => { 
                el.classList.remove('announce-active'); 
                box.style.borderLeftColor = "#00ffff";
            }, 3000);
        }

        function animate() { requestAnimationFrame(animate); const dt = clock.getDelta(); if (gameState.isPlaying) updateGame(dt); renderer.render(scene, camera); }

        function updateGame(dt) {
            const safeDt = Math.min(dt, 0.1); 
            const currLvl = LEVELS[gameState.currentLevelIdx];

            // Speed formula relies on level multiplier
            const targetSpeed = CONFIG.baseSpeed * currLvl.speedMult;
            if(gameState.speed < targetSpeed) gameState.speed += safeDt * 10;
            
            const dist = gameState.speed * safeDt;
            player.position.z -= dist; 
            gameState.score += dist * 0.2; // Score scales naturally with speed
            
            document.getElementById('score').innerText = Math.floor(gameState.score);
            document.getElementById('speed-gauge').innerText = Math.floor(gameState.speed * 2) + " KM/H";

            // Progress Bar Update
            const nextLvl = LEVELS[gameState.currentLevelIdx + 1];
            if (nextLvl) {
                const range = nextLvl.score - currLvl.score;
                const currentProgress = Math.max(0, gameState.score - currLvl.score);
                const pct = Math.min(100, (currentProgress / range) * 100);
                document.getElementById('progress-fill').style.width = pct + "%";
                document.getElementById('progress-text').innerText = `${currLvl.name} ---> ${nextLvl.name}`;
            } else {
                document.getElementById('progress-fill').style.width = "100%";
                document.getElementById('progress-text').innerText = "MAX LEVEL REACHED - GOD MODE";
            }

            // Exhaust Flames
            if(player.exhausts) {
                const exhaustScale = 1.0 + Math.random() * (gameState.speed / 100);
                player.exhausts.forEach(e => {
                    e.scale.z = exhaustScale + (Math.random() * 0.8);
                    e.material.color.setHex(Math.random() > 0.5 ? 0xffaa00 : 0x00ffff);
                });
            }

            // Level Progression
            if (gameState.currentLevelIdx < LEVELS.length - 1 && gameState.score >= LEVELS[gameState.currentLevelIdx + 1].score) {
                gameState.currentLevelIdx++;
                saveData.maxStageUnlocked = Math.max(saveData.maxStageUnlocked, gameState.currentLevelIdx);
                saveProgress();
                triggerLevelUp(LEVELS[gameState.currentLevelIdx].name);
            }

            // RGB God Mode or Normal Tween
            if (gameState.currentLevelIdx === LEVELS.length - 1) { // RGB Level
                const time = Date.now() * 0.001;
                const dynamicColor = new THREE.Color().setHSL(time % 1, 1, 0.5);
                scene.background.copy(dynamicColor).multiplyScalar(0.2);
                assets.mats.floor.color.copy(dynamicColor);
                assets.mats.barrierStrip.color.copy(dynamicColor);
            } else {
                const targetColors = LEVELS[gameState.currentLevelIdx];
                scene.background.lerp(new THREE.Color(targetColors.bg), safeDt * 1.5);
                scene.fog.color.lerp(new THREE.Color(targetColors.fog), safeDt * 1.5);
                sunLight.color.lerp(new THREE.Color(targetColors.sun), safeDt * 1.5);
                assets.mats.floor.color.lerp(new THREE.Color(targetColors.floor), safeDt * 1.5);
                assets.mats.barrierStrip.color.lerp(new THREE.Color(targetColors.floor), safeDt * 1.5);
            }

            // Speed VFX overlay
            const speedLines = document.getElementById('speed-lines');
            if(gameState.speed > 80) speedLines.style.opacity = Math.min(1.0, (gameState.speed - 80) / 100);
            else speedLines.style.opacity = '0';

            // Movement
            gameState.targetLaneX = gameState.lane * CONFIG.laneWidth;
            player.position.x += (gameState.targetLaneX - player.position.x) * 15 * safeDt;

            // Camera
            const shake = Math.max(0, (gameState.speed - 60) * 0.008);
            camera.fov = 70 + (gameState.speed - 40) * 0.3; camera.updateProjectionMatrix();
            camera.position.set(player.position.x * 0.5 + (Math.random()-0.5)*shake, 4.0 + (Math.random()-0.5)*shake, player.position.z + 7 + (gameState.speed*0.015));

            // Jump / Slide
            if (gameState.isJumping) {
                player.position.y += gameState.verticalVelocity * safeDt; gameState.verticalVelocity -= CONFIG.gravity * safeDt;
                if (player.position.y <= 0) { player.position.y = 0; player.rotation.x = 0; gameState.isJumping = false; }
            } else if (gameState.isSliding) {
                gameState.slideTimer -= safeDt;
                if(gameState.slideTimer <= 0) { gameState.isSliding = false; player.scale.y = 1.0; }
            }

            // Magnet
            if(gameState.magnetTimer > 0) {
                gameState.magnetTimer -= safeDt;
                if(gameState.magnetTimer <= 0) document.getElementById('magnet-icon').style.display = 'none';
            }

            // Spawning Limits
            if (pathChunks.length > 0 && player.position.z < pathChunks[0].z - CONFIG.pathLength - 20) { 
                const fc = pathChunks[0]; scene.remove(fc.mesh); pathChunks.shift();
                obstacles = obstacles.filter(o => o.parentGroup !== fc.mesh);
                coins = coins.filter(c => c.parentGroup !== fc.mesh);
                powerups = powerups.filter(p => p.parentGroup !== fc.mesh);
                createPathChunk(pathChunks[pathChunks.length - 1].z - CONFIG.pathLength, false);
            }

            // Coin Collect (Using Level Multiplier)
            coins.forEach(c => {
                if (!c.active) return;
                c.mesh.rotation.y += 0.1;
                const dX = player.position.x - c.mesh.position.x, dZ = player.position.z - c.mesh.position.z;
                
                if(gameState.magnetTimer > 0 && Math.abs(dZ) < 30) {
                    c.mesh.position.x += dX * 10 * safeDt; c.mesh.position.z += dZ * 10 * safeDt;
                }

                if (Math.abs(dZ) < 1.5 && Math.abs(dX) < 1.5 && player.position.y < 2.0) {
                    c.active = false; c.mesh.visible = false; 
                    const gained = 10 * currLvl.coinMult;
                    runCoins += gained; saveData.coins += gained;
                    document.getElementById('coin-counter').innerText = saveData.coins;
                }
            });

            // Powerup Collect
            powerups.forEach(p => {
                if (!p.active) return;
                p.mesh.rotation.x += 0.05; p.mesh.rotation.y += 0.05;
                if (Math.abs(player.position.z - p.mesh.position.z) < 1.5 && Math.abs(player.position.x - p.mesh.position.x) < 1.5 && player.position.y < 2.0) {
                    p.active = false; p.mesh.visible = false;
                    gameState.magnetTimer = 10; document.getElementById('magnet-icon').style.display = 'flex';
                }
            });

            // Hardcore Obstacle Collision
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                if (Math.abs(player.position.z - obs.mesh.position.z) < 2.8 && Math.abs(player.position.x - (obs.lane * CONFIG.laneWidth)) < 1.4) { 
                    
                    let hit = false;
                    if(obs.type === 'car') {
                        if (player.position.y < 1.0) { hit = true; gameState.deathReason = "YOU REAR-ENDED A CAR. JUMP NEXT TIME."; }
                    } else if (obs.type === 'bus') {
                        if (player.position.y < 3.5) { hit = true; gameState.deathReason = "YOU SMASHED INTO A BUS. DODGE THEM."; }
                    } else if (obs.type === 'tractor') {
                        if (!gameState.isSliding) { hit = true; gameState.deathReason = "HIT A TRACTOR. SLIDE UNDER THEM."; }
                    }

                    if (hit) {
                        gameOver(); break;
                    }
                }
            }
        }

        function gameOver() {
            gameState.isPlaying = false;
            if (gameState.score > saveData.highScore) saveData.highScore = Math.floor(gameState.score);
            saveProgress();
            
            document.getElementById('death-reason').innerText = gameState.deathReason;
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = Math.floor(gameState.score);
            document.getElementById('final-coins').innerText = "+" + runCoins;
        }

        init();
    </script>
</body>
</html>
